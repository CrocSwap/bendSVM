[package]
name = "bend-test-runner-modern"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Same JSON-lines protocol as scripts/test-runner on LiteSVM 0.13.0, which loads
# SBPFv0 and SBPFv3 programs. No runtime patches.
[dependencies]
litesvm = "=0.13.0"
agave-feature-set = "=4.0.0"
solana-address = { version = "=2.2.0", features = ["std"] }
solana-instruction = "=3.2.0"
solana-keypair = "=3.1.2"
solana-message = "=3.1.0"
solana-signer = "=3.0.0"
solana-transaction = { version = "=3.1.0", features = ["bincode"] }
solana-transaction-error = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
serde_json = "1"
