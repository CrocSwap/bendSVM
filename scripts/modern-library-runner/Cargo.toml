[package]
name = "bend-modern-library-runner"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
litesvm = "=0.13.0"
agave-feature-set = "=4.0.0"
solana-address = { version = "=2.2.0", features = ["std"] }
solana-instruction = "=3.2.0"
solana-keypair = "=3.1.2"
solana-message = "=3.1.0"
solana-signer = "=3.0.0"
solana-transaction = { version = "=3.1.0", features = ["bincode"] }
serde_json = "1"

[profile.release]
debug = 0
strip = true
