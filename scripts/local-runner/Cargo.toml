[package]
name = "bend-local-runner"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
base64 = "=0.22.1"
bincode = "=1.3.3"
serde_json = "1"
solana-instruction = "2.3"
solana-keypair = "2.2"
solana-message = "2.4"
solana-pubkey = "2.4"
solana-signer = "2.2"
solana-system-interface = { version = "=1.0.0", features = ["bincode"] }
solana-transaction = { version = "2.2", features = ["bincode"] }
